syntax = "proto3";

package identity.v1;

option go_package = "github.com/ashishSharma1203/rideflow/api/gen/identity/v1;identityv1";

import "google/api/annotations.proto";

// IdentityService provides methods related to user identity and authentication.
service IdentityService {

  //HealthCheck is a simple method to check the health of the service. It can be used by monitoring tools to ensure that the service is running and responsive.
  rpc HealthCheck(HealthCheckRequest)
      returns (HealthCheckResponse) {

    option (google.api.http) = {
      get: "/health"
    };
  }

  // RegisterUser is a method to register a new user. It accepts a RegisterUserRequest message containing the user's details and returns a RegisterUserResponse message with the result of the registration process.
  rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse) {
    option (google.api.http) = {
      post: "/api/v1/users/register"
      body: "*"
    };
  }

  //LoginUser is a method to authenticate a user. It accepts a LoginUserRequest message containing the user's email and password, and returns a LoginUserResponse message with the authenticated user's details and tokens if the authentication is successful.
  rpc LoginUser(LoginUserRequest) returns (LoginUserResponse) {
    option (google.api.http) = {
      post: "/api/v1/users/login"
      body: "*"
    };
}

}
message HealthCheckRequest {}

message HealthCheckResponse {
  string status = 1;
}

message RegisterUserRequest {
  string username = 1;
  string email = 2;
  string password = 3;
}

message RegisterUserResponse {
  string user_id = 1;
}

message LoginUserRequest {
  string email = 1;
  string password = 2;
}

message LoginUserResponse {
  User user = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message User {
  string id = 1;
  string username = 2;
  string email = 3;
}
