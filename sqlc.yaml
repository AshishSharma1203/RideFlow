version: "2"

sql:
  - engine: "postgresql"

    schema:
      - "migrations"

    queries:
      - "sql/queries"

    gen:
      go:
        package: "sqlc"

        out: "services/identity/internal/repository/sqlc"

        sql_package: "pgx/v5"

        emit_json_tags: true

        emit_interface: false

        emit_empty_slices: true
